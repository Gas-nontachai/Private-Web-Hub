name: movieapps
description: "Movie.exe: allowlisted sites in WebView with portable page rules."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/websites.json
    - assets/runtime/rule_runtime.js
  fonts:
    # Generated from assets/design/design_tokens.json.
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#153D9B" # Generated from assets/design/design_tokens.json.
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
