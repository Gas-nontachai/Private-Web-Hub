name: Android APK + Extension Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate existing tag and release metadata
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 tool/release_extension.py version "$RELEASE_TAG")
          build_number=$(python3 tool/release_extension.py android-code "$RELEASE_TAG")
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$tag_sha" origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "sha=$tag_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out tagged release source
        run: git checkout --detach "${{ steps.version.outputs.sha }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies and run Flutter checks
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Test Chrome extension packaging
        run: |
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m unittest discover -s tool -p 'test_*extension*.py'

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path
          required = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD",
                      "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD", "ANDROID_KEYSTORE_PATH")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing signing secrets: " + ", ".join(missing))
          try:
              data = base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit("Invalid ANDROID_KEYSTORE_BASE64") from None
          if not data:
              raise SystemExit("Empty release keystore")
          path = Path(os.environ["ANDROID_KEYSTORE_PATH"])
          with path.open("xb") as file:
              path.chmod(0o600)
              file.write(data)
          PY

      - name: Build signed universal APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: flutter build apk --release --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD_NUMBER"

      - name: Verify signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signing.txt"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/android-signing-cert.der"
          python3 tool/verify_release_apk.py "$apk" \
            "$RUNNER_TEMP/android-signing-cert.der" \
            "$RUNNER_TEMP/apk-signing.txt" "$RUNNER_TEMP/apk-badging.txt" \
            "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: Package APK and Chrome extension
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Movie.exe-$RELEASE_TAG.apk"
          python3 tool/package_extension_zip.py extension "$RELEASE_TAG" "dist/Movie.exe-$RELEASE_TAG.zip"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import zipfile
          tag = os.environ["RELEASE_TAG"]
          files = list(Path("dist").iterdir())
          expected = {f"Movie.exe-{tag}.apk", f"Movie.exe-{tag}.zip"}
          assert {item.name for item in files} == expected
          assert all(item.is_file() and item.stat().st_size for item in files)
          with zipfile.ZipFile(f"dist/Movie.exe-{tag}.zip") as archive:
              assert archive.testzip() is None
              assert "manifest.json" in archive.namelist()
          PY

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks" "$RUNNER_TEMP/android-signing-cert.der"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$RELEASE_TAG" --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.zip \
            --verify-tag --title "Movie.exe $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
